# 2013年版「半沢直樹」最終回（第10話）直後の人物の初期状態
#
# 出典: Wikipedia「半沢直樹」登場人物節（2026-11-08 に取得した wikitext）。
#       半沢の出向先での役職の換算は J-CAST ニュース 2013-09-24 の解説による。
#
# 値の種類:
#   - 事実（出典あり）: faction, rank, track, title, birth（birth_source: wikipedia / entry_year）
#   - 仮置き（著者の推定）: birth（birth_source: actor_proxy＝当時の演者の生年で代用）, ability, traits
#     traits は LLM からの方策抽出（Phase 3）までの暫定の行動ルールと、人事・処分の判断の癖に使う。
#     ability は世界モデルが業績を計算するときに使う（ドラマ内の評価をもとに推定）。
#
# rank: 銀行 1〜10（10=頭取）、金融庁 1〜6（2=主任検査官）。PLAN.md 3.2 節を参照。
# track: HQ=本部, BRANCH=支店, SECONDED=出向, EXTERNAL=外部組織
# faction: S=旧産業中央銀行, T=旧東京第一銀行, EXT=銀行外
#
# traits（0〜1。info_skill のみ倍率）:
#   ambition 出世欲 / aggression 攻撃性 / integrity 誠実さ / loyalty 味方への忠誠 / grudge 恨みの持続
#   info_skill 情報収集の力 / faction_bias 人事での派閥重視 / cronyism 人事での縁故重視
#   org_protect 処分での組織防衛（有力者への処分を軽くする傾向）

