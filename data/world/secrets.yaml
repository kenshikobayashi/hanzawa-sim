  - id: S6
    subject: hanzawa
    accomplices: []
    description: 黒崎との関係を公表すると岸川を脅し、役員会議で証言させた
    severity: 0.3
    public: false
    sanctioned: false
    knowers: {hanzawa: 1.0, kishikawa: 1.0}
