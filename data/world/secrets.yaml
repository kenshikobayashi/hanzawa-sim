# 最終回直後の時点で存在する秘密（不正・弱み）と、それを知っている人物
#
# knowers: 人物ID → その人物が持つ証拠の強さ（0〜1）。キーに含まれる人物だけがその秘密を知っている。
# severity: 重大度（0〜1）。処分の重さの基準になる。仮置き。
# public: 公然か。sanctioned: 処分済みか。
# confidence: fact = Wikipedia 記載から確認 / estimate = 誰が知っているか等に推定を含む
#
# 2020年版で明かされる情報（旧T時代の不正融資、牧野副頭取の死の真相など）は入れない。

secrets:
  - id: S1
    subject: owada
    accomplices: [kishikawa]
    description: タミヤ電機経由の妻の会社（ラフィット）への迂回融資と、伊勢島ホテルへの不正融資
    severity: 0.8
    public: true
    sanctioned: true
    knowers: {owada: 1.0, kishikawa: 1.0, hanzawa: 1.0, nakanowatari: 1.0, takagi: 1.0, naito: 1.0}
    confidence: fact

  - id: S2
