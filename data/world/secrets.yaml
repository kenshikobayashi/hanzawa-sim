    severity: 0.5
    public: false
    sanctioned: false
    knowers: {kurosaki: 1.0, kishikawa: 1.0, hanzawa: 0.8}
    confidence: estimate

  - id: S4
    subject: owada
    accomplices: []
    description: 出向中の近藤に銀行への復帰を約束し、迂回融資の報告書を渡させた（証拠の握りつぶし）
    severity: 0.5
    public: false
    sanctioned: false
    knowers: {owada: 1.0, kondo: 1.0, hanzawa: 0.5, tomari: 0.4}
    confidence: estimate      # 渡真利が知っているかは要確認

  - id: S5
    subject: hanzawa
    accomplices: []
    description: 金融庁検査の際、伊勢島ホテル関連の資料を行外へ移して隠した（疎開資料）
    severity: 0.5
    public: false
    sanctioned: false
    knowers: {hanzawa: 1.0, kurosaki: 0.2}
