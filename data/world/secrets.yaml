  - id: S9
    subject: fukuyama
    accomplices: [kishikawa]
    description: 岸川の命令で偽の疎開資料を作り、銀行を危機に陥れようとした（半沢に追及されて認めた）
    severity: 0.6
    public: false
    sanctioned: false
    knowers: {fukuyama: 1.0, kishikawa: 1.0, hanzawa: 0.9}
