    holders: [hanzawa, owada]
    description: 大和田が半沢の父の工場（半沢ネジ）への融資を打ち切り、父を自殺に追い込んだ
  - id: S8
    holders: [nakanowatari]
    description: 大和田を降格で留めたのは旧S派を取り込み行内融和を図るため。半沢の出向は大和田派の報復から守り、証券の経験を積ませるため
    source_note: 2020年版で明かされる設定。プロンプトに「2020年版」の語を入れないよう、説明とは別に書く
    switchable: true          # 入れない場合の結果も併記する（PLAN.md 3.3 節）
