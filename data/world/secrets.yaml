    public: false
    sanctioned: false
    knowers: {kaise: 1.0, furusato: 1.0, owada: 1.0, hanzawa: 0.8, tomari: 0.7, kondo: 0.7}
    confidence: estimate      # 役員会議でどこまで明らかになったかは要確認

# 弱みとしては使えないが、人物の動機・意図として各人物の知識に入れる事実
private_facts:
