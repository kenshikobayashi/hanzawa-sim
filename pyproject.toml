[project]
name = "hanzawa-sim"
version = "0.1.0"
description = "半沢直樹（2013年版）最終回以降の東京中央銀行の権力闘争を、人物ごとのLLMエージェントとモンテカルロで分析するシミュレーション"
readme = "README.md"
authors = [
    { name = "kenshikoba" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
